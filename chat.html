<!DOCTYPE html>
<html>

<head>

<title>AI Chatbot</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="chat-container">

<h2>
Welcome {{ username }}
</h2>

<div id="chat-box">

</div>

<input
type="text"
id="message"
placeholder="Type your message...">

<button onclick="sendMessage()">

Send

</button>

<br><br>

<a href="/logout">

Logout

</a>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
